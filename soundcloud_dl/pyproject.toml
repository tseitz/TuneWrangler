[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "soundcloud-dl"
version = "0.2.0"
description = "SoundCloud free-download automation (API + stealth Playwright)"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
soundcloud-dl = "soundcloud_dl.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "ty>=0.0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_browser: test requires a real Chromium launch (auto-skipped under sandbox)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# pytest tests legitimately use bare assert, magic literals, and unannotated
# fixtures. Private-member access is also expected — we test _foo helpers.
"tests/**" = [
    "S101",      # assert is pytest's whole job
    "PLR2004",   # magic values are normal in test data
    "ANN",       # type annotations not required on test fns/fixtures
    "ARG",       # autouse fixtures and pytest hooks have unused params
    "PLC0415",   # in-fixture imports are a normal pattern
    "SLF001",    # tests reach into private (_foo) helpers
    "INP001",    # tests/ has __init__.py; rule still flags conftest sometimes
]

[tool.ty.environment]
python-version = "3.12"
# Point ty at the project's own venv so it resolves third-party deps
# (playwright, yaml, pytest) regardless of where ty is invoked from.
python = ".venv"
