[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "rekordbox-smart-playlists"
version = "1.0.0"
description = "Manage Rekordbox smart playlists from JSON configuration files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyrekordbox==0.4.4",
    "sqlalchemy>=2.0,<2.1",
    "python-dotenv>=1.2.1",
    "colorama>=0.4.4",
    "numpy<2",  # essentia-tensorflow wheels are built against NumPy 1.x
    "scikit-learn",
]

[project.optional-dependencies]
tagging = ["essentia-tensorflow==2.1b6.dev1177"]

[project.scripts]
rsp = "rekordbox_smart_playlists.cli.main:cli_main"

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "ty>=0.0.21",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"
python = ".venv"
